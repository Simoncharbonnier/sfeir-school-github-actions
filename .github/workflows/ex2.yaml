name: Switch Node Version
on:
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: 20
jobs:
  run-npm-test:
    runs-on: self-hosted
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name : setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
      - name: run test
        shell: bash
        run: |
          echo "node -v"
          echo "npm install"
          echo "npm test"
